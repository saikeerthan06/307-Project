apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-allow-from-ingress-nginx
spec:
  podSelector:
    matchLabels: { app: ui }      # both blue and green
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8501 }  # UI containerPort
