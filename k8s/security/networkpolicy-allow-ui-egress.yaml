apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-allow-egress-to-backends
spec:
  podSelector:
    matchLabels: { app: ui }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: data-preprocessing } }
        - podSelector: { matchLabels: { app: model-training } }
        - podSelector: { matchLabels: { app: model-inference } }
      ports:
        - { protocol: TCP, port: 8000 }
