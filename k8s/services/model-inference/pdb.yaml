# -----------------------------------------------------------------------------
# PodDisruptionBudget for the model-inference pods.
# Ensures at least 1 pod is always available 
# during voluntary disruptions (e.g., upgrades, maintenance).
# -----------------------------------------------------------------------------

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: model-inference-pdb
  namespace: hospital-ml
  labels:
    app: model-inference
    part-of: hospital-ml
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: model-inference
