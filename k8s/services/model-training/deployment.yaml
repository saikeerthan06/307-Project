apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-training
  namespace: hospital-ml
  labels:
    app: model-training
    tier: backend
    part-of: hospital-ml
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: model-training
  template:
    metadata:
      labels:
        app: model-training
        tier: backend
        part-of: hospital-ml
    spec:
      serviceAccountName: model-training-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "Always"
      initContainers:
        - name: init-perms
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              mkdir -p /shared/data/raw /shared/data/clean /shared/models/artifacts &&
              chown -R 1000:1000 /shared &&
              chmod -R g+rwX /shared
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: shared-volume
              mountPath: /shared
      containers:
        - name: api
          image: model-training:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: model-training-config
            - secretRef:
                name: model-training-secret
          env:
            - name: RAW_DIR
              value: /shared/data/raw
            - name: CLEAN_DIR
              value: /shared/data/clean
            - name: MODEL_DIR
              value: /shared/models
          volumeMounts:
            - name: shared-volume
              mountPath: /shared
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: shared-pvc
