# -----------------------------------------------------------------------------
# Service (ClusterIP) for the model-training pods.
# Provides stable internal access on port 8000 
# by load-balancing traffic across all healthy pods.
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: model-training-svc
  namespace: hospital-ml
  labels:
    app: model-training
    tier: backend
    part-of: hospital-ml
spec:
  type: ClusterIP
  selector:
    app: model-training
  ports:
    - name: http
      port: 8000
      targetPort: http
