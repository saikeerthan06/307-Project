# -----------------------------------------------------------------------------
# PodDisruptionBudget for the data-preprocessing pods.
# Ensures at least 1 pod is always available 
# during voluntary disruptions (e.g., upgrades, maintenance).
# -----------------------------------------------------------------------------

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: data-preprocessing-pdb
  namespace: hospital-ml
  labels:
    app: data-preprocessing
    part-of: hospital-ml
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: data-preprocessing
