apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-preprocessing-hpa
  namespace: hospital-ml
  labels:
    app: data-preprocessing
    part-of: hospital-ml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-preprocessing
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
