apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-preprocessing
  namespace: hospital-ml
  labels:
    app: data-preprocessing
    tier: backend
    part-of: hospital-ml
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: data-preprocessing
  template:
    metadata:
      labels:
        app: data-preprocessing
        tier: backend
        part-of: hospital-ml
    spec:
      # Non-root + shared volume safe defaults
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: api
          image: data-preprocessing:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RAW_DIR
              value: /shared/data/raw
            - name: CLEAN_DIR
              value: /shared/data/clean
            - name: MODEL_DIR
              value: /shared/models
          volumeMounts:
            - name: shared-volume
              mountPath: /shared
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: shared-pvc
