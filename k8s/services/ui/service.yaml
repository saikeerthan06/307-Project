# -----------------------------------------------------------------------------
# Service (ClusterIP) for the ui pods.
# Provides stable internal access on port 8501 
# by load-balancing traffic across all healthy pods.
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: ui
  labels: { app: ui, part-of: hospital-ml, tier: frontend }
spec:
  type: ClusterIP
  selector: { app: ui, version: blue }  # flip to {version: green} to cutover
  ports:
    - name: http
      port: 80
      targetPort: 8501
