apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-to-backends
  namespace: hospital-ml
spec:
  podSelector:
    matchExpressions:                 # allow multiple backends by label
      - key: app
        operator: In
        values: ["model-training","data-preprocessing","model-inference"]
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ui
    ports:
    - protocol: TCP
      port: 8000