apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-backup
  labels: { part-of: hospital-ml, purpose: backup }
spec:
  schedule: "0 2 * * *"   # 02:00 every day
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app: backup }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: Always
          volumes:
            - name: shared
              persistentVolumeClaim: { claimName: shared-pvc }
          containers:
            - name: backup
              image: busybox:1.36
              args:
                - sh
                - -c
                - |
                  set -e
                  TS=$(date +%Y%m%d-%H%M%S)
                  mkdir -p /shared/models/artifacts/backups
                  tar czf /shared/models/artifacts/backups/backup-$TS.tgz -C /shared models data/clean || true
                  chown 1000:1000 /shared/models/artifacts/backups/backup-$TS.tgz || true
                  echo "Backup written to /shared/models/artifacts/backups/backup-$TS.tgz"
              volumeMounts:
                - { name: shared, mountPath: /shared }
