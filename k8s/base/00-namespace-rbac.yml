apiVersion: v1
kind: Namespace
metadata:
  name: hospital-ml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-training-sa
  namespace: hospital-ml
---
# Minimal Role: list/get pods in its own namespace (logs/debug), nothing cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-training-role
  namespace: hospital-ml
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-training-rb
  namespace: hospital-ml
subjects:
- kind: ServiceAccount
  name: model-training-sa
  namespace: hospital-ml
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-training-role