apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 1
  selector: { matchLabels: { app: ui } }
  template:
    metadata:
      labels: { app: ui }
    spec:
      containers:
        - name: ui
          image: your-dockerhub-username/ui:latest
          ports: [{ containerPort: 8501 }]
          env:
            - { name: PREPROC_URL, value: "http://data-preprocessing:8000" }
            - { name: TRAIN_URL,   value: "http://model-training:8000" }
            - { name: INFER_URL,   value: "http://model-inference:8000" }
            - { name: RAW_DIR,     value: "/shared/data/raw" }
            - { name: CLEAN_DIR,   value: "/shared/data/clean" }
            - { name: MODEL_DIR,   value: "/shared/models" }
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: ml-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ui
spec:
  type: ClusterIP
  selector: { app: ui }
  ports:
    - port: 80
      targetPort: 8501
---
# Expose UI (adjust host/path as you like)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: ui.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80

